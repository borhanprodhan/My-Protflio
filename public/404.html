<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD. Borhan Prodhan — Redirecting</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var last = segments[segments.length - 1] || '';
        var isAdmin = last === 'admin';
        if (window.location.hostname.endsWith('github.io')) {
          if (segments.length >= 2) {
            var base = '/' + segments[0] + '/';
            window.location.replace(isAdmin ? base + '#/admin' : base);
          } else if (segments.length === 1 && !isAdmin) {
            window.location.replace('/' + segments[0] + '/');
          } else {
            window.location.replace(isAdmin ? '/#/admin' : '/');
          }
        } else {
          window.location.replace(isAdmin ? '/#/admin' : '/');
        }
      })();
    </script>
  </head>
  <body style="background:#080B14;color:#F8FAFC;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
    <p>Redirecting to portfolio...</p>
  </body>
</html>
